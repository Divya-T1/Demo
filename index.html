<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Learning Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-white border-b px-6 py-4 shadow-sm flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-indigo-600">AI Learning Assistant</h1>
      <p class="text-sm text-gray-400">PDF Research Assistant &amp; Prompt Sandbox</p>
    </div>
    <div id="scored-badge" class="hidden text-sm text-indigo-600 font-medium bg-indigo-50 border border-indigo-200 rounded-full px-3 py-1">
      🧪 <span id="scored-count">0</span> scored
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-6">

    <!-- Tabs -->
    <div class="flex gap-2 mb-6 border-b pb-4">
      <button onclick="setTab('upload')" id="tab-upload"  class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white">📄 Upload</button>
      <button onclick="setTab('chat')"   id="tab-chat"    class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">💬 Chat</button>
      <button onclick="setTab('sandbox')" id="tab-sandbox" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">🧪 Sandbox</button>
    </div>

    <!-- Upload panel -->
    <div id="panel-upload">
      <div
        onclick="document.getElementById('file-input').click()"
        ondragover="event.preventDefault()"
        ondrop="handleDrop(event)"
        class="border-2 border-dashed border-gray-300 rounded-xl p-16 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-all"
      >
        <input id="file-input" type="file" accept=".pdf" class="hidden" onchange="handleFile(this.files[0])">
        <p class="text-4xl mb-3">📄</p>
        <p id="upload-label" class="text-gray-500 font-medium">Drop a PDF here or click to upload</p>
      </div>
      <div id="doc-list" class="mt-4 space-y-2"></div>
    </div>

    <!-- Chat panel -->
    <div id="panel-chat" class="hidden">
      <div id="messages" class="min-h-72 space-y-3 mb-4">
        <p id="chat-empty" class="text-center text-gray-400 pt-16 text-sm">Upload a document first, then ask questions about it</p>
      </div>
      <div class="flex gap-2">
        <input
          id="chat-input"
          type="text"
          placeholder="Ask about your documents..."
          onkeydown="if(event.key==='Enter') sendChat()"
          class="flex-1 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
        />
        <button onclick="sendChat()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Send</button>
      </div>
    </div>

    <!-- Sandbox panel -->
    <div id="panel-sandbox" class="hidden space-y-4">
      <p class="text-sm text-gray-500">Test your prompts and get scored on clarity, specificity, and relevance.</p>
      <div class="flex gap-2">
        <input
          id="sandbox-input"
          type="text"
          placeholder="Enter a question to score..."
          onkeydown="if(event.key==='Enter') scoreSandbox()"
          class="flex-1 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
        />
        <button id="score-btn" onclick="scoreSandbox()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Score</button>
      </div>
      <div id="sandbox-result" class="hidden bg-white border rounded-xl p-6 space-y-4">
        <div class="flex items-center gap-4">
          <span id="score-display" class="text-4xl font-bold text-indigo-600"></span>
          <div class="flex-1 bg-gray-100 rounded-full h-3 overflow-hidden">
            <div id="score-bar" class="bg-indigo-600 h-3 rounded-full transition-all duration-500" style="width:0%"></div>
          </div>
        </div>
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Feedback</p>
          <p id="score-feedback" class="text-sm text-gray-700"></p>
        </div>
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Try this instead</p>
          <p id="score-improved" class="text-sm text-indigo-700 bg-indigo-50 rounded-lg px-3 py-2 italic"></p>
        </div>
      </div>
    </div>

  </main>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    const docs = []
    let chatTurn = 0
    let scoredCount = 0

    // ─── Tabs ─────────────────────────────────────────────────────────────────
    function setTab(id) {
      ['upload', 'chat', 'sandbox'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== id)
        const btn = document.getElementById(`tab-${t}`)
        btn.className = `px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
          t === id ? 'bg-indigo-600 text-white' : 'text-gray-600 hover:bg-gray-100'
        }`
      })
    }

    // ─── Upload ───────────────────────────────────────────────────────────────
    function handleDrop(e) {
      e.preventDefault()
      handleFile(e.dataTransfer.files[0])
    }

    function handleFile(file) {
      if (!file) return
      const label = document.getElementById('upload-label')
      label.textContent = 'Processing...'
      setTimeout(() => {
        docs.push(file.name)
        label.textContent = 'Drop a PDF here or click to upload'
        const item = document.createElement('div')
        item.className = 'flex items-center gap-2 bg-white border rounded-lg px-4 py-3 text-sm'
        item.innerHTML = `<span class="text-green-500">✓</span><span class="text-gray-700">${file.name}</span>`
        document.getElementById('doc-list').appendChild(item)
        document.getElementById('chat-empty')?.remove()
      }, 1200)
    }

    // ─── Chat ─────────────────────────────────────────────────────────────────
    const chatReplies = [
      "Based on the uploaded document, this project focuses on applying structured methodologies to solve real-world problems. The key deliverables include an analytical framework and a set of actionable recommendations.",
      "The document highlights three main phases: discovery, design, and delivery. Each phase has defined success metrics — you might want to ask about a specific phase to go deeper.",
      "From the document, the authors recommend cross-functional collaboration and early stakeholder buy-in as critical success factors. The timeline spans roughly 10 weeks.",
      "The project scope is bounded to the core problem statement. Out-of-scope items include long-term maintenance and external system integrations — worth keeping in mind when forming your questions.",
    ]

    function addMessage(role, text) {
      const wrap = document.createElement('div')
      wrap.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`
      wrap.innerHTML = `<div class="max-w-[80%] px-4 py-2 rounded-2xl text-sm leading-relaxed ${
        role === 'user'
          ? 'bg-indigo-600 text-white rounded-br-sm'
          : 'bg-white border text-gray-800 rounded-bl-sm'
      }">${text}</div>`
      document.getElementById('messages').appendChild(wrap)
      wrap.scrollIntoView({ behavior: 'smooth' })
    }

    async function sendChat() {
      const input = document.getElementById('chat-input')
      const q = input.value.trim()
      if (!q) return
      input.value = ''
      addMessage('user', q)

      const thinking = document.createElement('div')
      thinking.className = 'flex justify-start'
      thinking.innerHTML = '<div class="bg-white border px-4 py-2 rounded-2xl rounded-bl-sm text-sm text-gray-400">Thinking...</div>'
      document.getElementById('messages').appendChild(thinking)

      await delay(1400)
      thinking.remove()
      addMessage('assistant', chatReplies[chatTurn % chatReplies.length])
      chatTurn++
    }

    // ─── Sandbox ──────────────────────────────────────────────────────────────
    function scoreQuestion(q) {
      const words = q.trim().split(/\s+/).length
      const hasQuestion = q.includes('?')
      const isSpecific = /\b(specifically|exactly|how|why|what|which|compare|difference|impact|result|outcome|approach)\b/i.test(q)
      const isTooShort = words < 5
      const isTooVague = /^(tell me|explain|describe)\b/i.test(q) && words < 8

      let score = 5
      if (words >= 8)  score += 1
      if (words >= 14) score += 1
      if (hasQuestion) score += 1
      if (isSpecific)  score += 1
      if (isTooShort)  score -= 2
      if (isTooVague)  score -= 1
      score = Math.max(1, Math.min(10, score))

      const feedback =
        score <= 4 ? "Try being more specific about what you want to learn. Vague questions get vague answers — reference a particular aspect of the project or a specific concept you saw in the document." :
        score <= 7 ? "Good start! The question is clear but could be sharpened. Adding context about why you're asking, or what you already know, will produce a more useful response." :
                     "Well-crafted question. It's specific, grounded in the document, and gives enough context to get a meaningful answer."

      const improved = score < 8
        ? `Based on the uploaded document, ${q.replace(/\?$/, '')} — specifically, what are the key decision points and expected outcomes?`
        : q

      return { score, feedback, improved }
    }

    async function scoreSandbox() {
      const input = document.getElementById('sandbox-input')
      const q = input.value.trim()
      if (!q) return

      const btn = document.getElementById('score-btn')
      btn.textContent = 'Scoring...'
      btn.disabled = true

      await delay(1000)

      const { score, feedback, improved } = scoreQuestion(q)
      document.getElementById('score-display').textContent = `${score}/10`
      document.getElementById('score-bar').style.width = `${score * 10}%`
      document.getElementById('score-feedback').textContent = feedback
      document.getElementById('score-improved').textContent = improved
      document.getElementById('sandbox-result').classList.remove('hidden')

      scoredCount++
      document.getElementById('scored-count').textContent = scoredCount
      document.getElementById('scored-badge').classList.remove('hidden')

      btn.textContent = 'Score'
      btn.disabled = false
    }

    // ─── Helpers ──────────────────────────────────────────────────────────────
    const delay = ms => new Promise(r => setTimeout(r, ms))
  </script>
</body>
</html>
